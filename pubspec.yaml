name: taka_counter
description: "TakaTally — a beautiful, private cash counter for Bangladesh."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  excel: ^4.0.6
  path_provider: ^2.1.5
  file_picker: ^11.0.3
  pdf: ^3.11.3
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#173F2E"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/app_icon_monochrome.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-700.ttf
          weight: 700
