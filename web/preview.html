<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Taka Counter · phone preview</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 8%, #f2cf63 0, transparent 33%),
        radial-gradient(circle at 82% 88%, #9dbc3f 0, transparent 36%),
        #2b2114;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      box-sizing: border-box;
      font-family: sans-serif;
    }
    .device {
      width: 390px;
      height: 844px;
      border-radius: 42px;
      padding: 9px;
      background: #101512;
      box-shadow: 0 38px 90px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255,255,255,.16);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 34px;
      background: #f5f3ec;
    }
    .label {
      position: fixed;
      left: 28px;
      bottom: 18px;
      color: rgba(255,255,255,.5);
      font: 600 11px/1.4 system-ui, sans-serif;
      letter-spacing: .12em;
    }
  </style>
</head>
<body>
  <div class="device">
    <iframe src="/?demo=1" title="Taka Counter preview"></iframe>
  </div>
  <div class="label">TAKA COUNTER · 390 × 844</div>
</body>
</html>
